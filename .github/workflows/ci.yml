name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  formulae:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: tap this checkout
        run: brew tap jrnxf/tap "$GITHUB_WORKSPACE"
      - name: install
        run: |
          for f in Formula/*.rb; do
            brew install --build-from-source "jrnxf/tap/$(basename "$f" .rb)"
          done
      - name: test
        run: |
          for f in Formula/*.rb; do
            brew test "jrnxf/tap/$(basename "$f" .rb)"
          done
      - name: audit
        run: |
          for f in Formula/*.rb; do
            brew audit --strict --skip-style "jrnxf/tap/$(basename "$f" .rb)"
          done
      - name: style
        # the lowercase description is the owner's choice, so skip only the FormulaAudit/Desc cop
        run: |
          for f in Formula/*.rb; do
            brew style --except-cops=FormulaAudit/Desc "jrnxf/tap/$(basename "$f" .rb)"
          done
