name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  formulae:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: tap this checkout
        run: brew tap jrnxf/tap "$GITHUB_WORKSPACE"
      - name: list formulae
        # A head-only formula (no release yet, like drip before v0.1.0) builds a private
        # repository's main, which CI cannot clone, so only formulae with a release are built.
        # brew reads the stable version itself, so a url inside on_macos or on_linux counts too.
        run: |
          names=""
          for f in Formula/*.rb; do
            name="$(basename "$f" .rb)"
            if [ "$(brew info --json=v2 "jrnxf/tap/$name" | jq -r '.formulae[0].versions.stable')" != null ]; then
              names="$names $name"
            fi
          done
          echo "FORMULAE=$names" >> "$GITHUB_ENV"
      - name: install
        run: |
          for f in $FORMULAE; do
            brew install --build-from-source "jrnxf/tap/$f"
          done
      - name: test
        run: |
          for f in $FORMULAE; do
            brew test "jrnxf/tap/$f"
          done
      - name: audit
        run: |
          for f in $FORMULAE; do
            brew audit --strict --skip-style "jrnxf/tap/$f"
          done
      - name: style
        # the lowercase description is the owner's choice, so skip only the FormulaAudit/Desc cop
        run: |
          for f in Formula/*.rb; do
            brew style --except-cops=FormulaAudit/Desc "jrnxf/tap/$(basename "$f" .rb)"
          done
